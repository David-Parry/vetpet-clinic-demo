# Development Profile Configuration
# This profile is for local development only

#----------------------------------------------------------------
# Logging - Verbose for development
#----------------------------------------------------------------
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.graphql=DEBUG
logging.level.graphql=DEBUG

#----------------------------------------------------------------
# GraphQL - Introspection enabled for development
#----------------------------------------------------------------
spring.graphql.schema.introspection.enabled=true

#----------------------------------------------------------------
# CORS - Permissive for local development
#----------------------------------------------------------------
cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://localhost:9977

#----------------------------------------------------------------
# Security Keys - Load from environment or use default for dev
#----------------------------------------------------------------
# For development, keys can be generated locally
# Use environment variables: JWT_PUBLIC_KEY and JWT_PRIVATE_KEY
# Or generate with: ./generate-keys.sh
