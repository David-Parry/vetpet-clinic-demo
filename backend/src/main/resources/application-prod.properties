# Production Profile Configuration
# This profile is for production deployments

#----------------------------------------------------------------
# Logging - Minimal for production
#----------------------------------------------------------------
logging.level.org.springframework.security=WARN
logging.level.org.springframework.graphql=INFO
logging.level.graphql=INFO

#----------------------------------------------------------------
# GraphQL - Introspection disabled for security
#----------------------------------------------------------------
spring.graphql.schema.introspection.enabled=false

#----------------------------------------------------------------
# CORS - Restrictive for production
#----------------------------------------------------------------
# Set this via environment variable: CORS_ALLOWED_ORIGINS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://yourdomain.com}

#----------------------------------------------------------------
# Security Keys - MUST be provided via environment variables
#----------------------------------------------------------------
# Required environment variables:
# - JWT_PUBLIC_KEY: Base64 encoded public key
# - JWT_PRIVATE_KEY: Base64 encoded private key
