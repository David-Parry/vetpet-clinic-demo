# DataSource configuration omitted,
# as Spring Boot 3.1+ uses configuration from
# docker-compose/TestContainer automatically
spring.jpa.hibernate.ddl-auto=validate

#----------------------------------------------------------------
# Server Configuration
#----------------------------------------------------------------
server.port=9977

#----------------------------------------------------------------
# Logging - Default levels (can be overridden by profiles)
#----------------------------------------------------------------
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.graphql=INFO
logging.level.graphql=INFO

#----------------------------------------------------------------
# Spring Security
#----------------------------------------------------------------
spring.security.filter.dispatcher-types=request,error

# SECURITY NOTE: Keys should be loaded from environment variables
# For backward compatibility during migration, we support both:
# 1. Environment variables (recommended): JWT_PUBLIC_KEY_PATH, JWT_PRIVATE_KEY_PATH
# 2. Classpath resources (deprecated, for local dev only)
# 
# To use environment variables, set:
#   JWT_PUBLIC_KEY_PATH=/path/to/public_key.pem
#   JWT_PRIVATE_KEY_PATH=/path/to/private_key.pem
#
# For local development only, keys can be in classpath (will be removed from git)
publicKey=${JWT_PUBLIC_KEY_PATH:classpath:keys/public_key.pem}
privateKey=${JWT_PRIVATE_KEY_PATH:classpath:keys/private_key.pem}

#----------------------------------------------------------------
# spring-graphql config
#----------------------------------------------------------------
# Note that we DO NOT use the embedded GraphiQL UI from
# spring-graphql yet, because we use our own version
# that contains a login form
spring.graphql.graphiql.enabled=true

# GraphQL introspection - controlled by profile
# Default: enabled (can be disabled in production profile)
spring.graphql.schema.introspection.enabled=true

# !!! For CORS configuration see SecurityConfig class !!!\

# GraphQL endpoints for Web and WebSocket requests
# Note that these endpoints are accessible only with a
# valid JWT token.
spring.graphql.path=/graphql
spring.graphql.websocket.path=/graphqlws

#----------------------------------------------------------------
# CORS Configuration
#----------------------------------------------------------------
# Default allowed origins (can be overridden by profiles)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
